version: 2

sources:
  - name: insurance
    description: >
      Policy admin book in the warehouse backend (RAW_INSURANCE).
      Customers are keyed to the group party, separate from the banking customer id.
    schema: raw_insurance
    tables:
      - name: customers
        description: One row per insurance customer.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 100000, period: hour}
      - name: policies
        description: One row per policy. Only active policies count toward holdings and premium.

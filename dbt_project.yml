name: "op_banking"
version: "1.0.0"
config-version: 2
profile: "op_banking"

model-paths: ["models"]
# Raw CSVs under seeds/ are loaded into Snowflake RAW_* schemas by provision — not dbt seed.
seed-paths: ["_not_seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]


models:
  op_banking:
    +materialized: view
    marts:
      +schema: marts
      +access: private
      +materialized: table

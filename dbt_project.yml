name: "{{banking_project}}"
version: "1.0.0"
config-version: 2
profile: "{{banking_project}}"

model-paths: ["models"]
# Raw CSVs under seeds/ are loaded into Snowflake RAW_* schemas by provision — not dbt seed.
seed-paths: []
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]


models:
  {{banking_project}}:
    +materialized: view
    marts:
      +schema: marts
      +access: private
      +materialized: table

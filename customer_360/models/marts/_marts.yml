version: 2

models:
  - name: customer_360
    description: >
      Public group customer 360. One row per party_key, built only from
      cross-project refs to banking, insurance, wealth, and financials.
      customer_id_hash uses the shared anonymize macro.
    config:
      access: public
      contract:
        enforced: true
    semantic_model:
      enabled: true
    agg_time_dimension: as_of_date
    columns:
      - name: customer_id
        description: Group party key (P-…).
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: customer
      - name: customer_id_hash
        description: Anonymized party key via anonymize macro.
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: banking_customer_id
        description: Banking customer id when the party is in banking.
        data_type: varchar
      - name: banking_status
        description: Banking relationship status.
        data_type: varchar
        dimension:
          type: categorical
      - name: account_count
        description: Open banking accounts.
        data_type: integer
        constraints: [{type: not_null}]
      - name: loan_count
        description: Outstanding loans.
        data_type: integer
        constraints: [{type: not_null}]
      - name: loan_balance
        description: Sum of outstanding loan principal.
        data_type: number(18,2)
        constraints: [{type: not_null}]
      - name: insurance_customer_id
        description: Insurance customer id when the party is in insurance.
        data_type: varchar
      - name: insurance_status
        description: Insurance relationship status.
        data_type: varchar
        dimension:
          type: categorical
      - name: active_policy_count
        description: In-force insurance policies.
        data_type: integer
        constraints: [{type: not_null}]
      - name: annual_premium
        description: Sum of in-force annual premium.
        data_type: number(18,2)
        constraints: [{type: not_null}]
      - name: wealth_customer_id
        description: Wealth client id when the party is in wealth.
        data_type: varchar
      - name: wealth_status
        description: Wealth relationship status.
        data_type: varchar
        dimension:
          type: categorical
      - name: portfolio_count
        description: Open wealth portfolios.
        data_type: integer
        constraints: [{type: not_null}]
      - name: assets_under_management
        description: Sum of open portfolio market value.
        data_type: number(18,2)
        constraints: [{type: not_null}]
      - name: total_revenue
        description: Sum of revenue from financials (all months).
        data_type: number(18,2)
        constraints: [{type: not_null}]
      - name: total_cost
        description: Sum of cost from financials (all months).
        data_type: number(18,2)
        constraints: [{type: not_null}]
      - name: total_profit
        description: Sum of profit from financials (all months).
        data_type: number(18,2)
        constraints: [{type: not_null}]
      - name: profit_months
        description: Months with both priced revenue and allocated cost.
        data_type: integer
        constraints: [{type: not_null}]
      - name: domain_count
        description: How many of banking / insurance / wealth the party appears in.
        data_type: integer
        constraints: [{type: not_null}]
      - name: as_of_date
        description: Reporting date for the Semantic Layer (fixed demo date).
        data_type: date
        constraints: [{type: not_null}]
        granularity: day
        dimension:
          type: time
    metrics:
      - name: customers
        description: Parties on the customer 360.
        label: Customers
        type: simple
        agg: count
        expr: "1"
      - name: total_revenue
        description: Sum of total_revenue.
        label: Total revenue
        type: simple
        agg: sum
        expr: total_revenue
      - name: total_profit
        description: Sum of total_profit.
        label: Total profit
        type: simple
        agg: sum
        expr: total_profit
      - name: assets_under_management
        description: Sum of assets under management.
        label: AUM
        type: simple
        agg: sum
        expr: assets_under_management

  - name: time_spine_daily
    description: Minimal day spine required by the Semantic Layer.
    config:
      access: protected
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Reporting day.
        data_type: date
        granularity: day
        data_tests: [unique, not_null]

  - name: customer_churn
    description: >
      Python model. Scores each customer_360 party for churn from relationship
      status, profit, how many domains they use, and whether they still hold products.
    config:
      access: public
    columns:
      - name: customer_id
        description: Group party key. One score per customer_360 row.
        data_type: varchar
        data_tests: [unique, not_null]
      - name: churn_score
        description: Weighted score from 0 to 1. 0.40 status, 0.30 profit, 0.20 single domain, 0.10 no products.
        data_type: number(4,2)
        data_tests: [not_null]
      - name: predicted_churn
        description: True when churn_score is at least 0.40.
        data_type: boolean
        data_tests: [not_null]
      - name: churn_band
        description: high at 0.40 and above, medium at 0.20, otherwise low.
        data_type: varchar
        data_tests: [not_null]
      - name: churn_reasons
        description: Short explanation of the flags that raised the score.
        data_type: varchar
        data_tests: [not_null]
      - name: status_risk
        description: 1 when banking, insurance, or wealth status is inactive, closed, or frozen.
        data_type: integer
        data_tests: [not_null]
      - name: profit_risk
        description: 1 when total profit is negative.
        data_type: integer
        data_tests: [not_null]
      - name: concentration_risk
        description: 1 when the party appears in at most one domain.
        data_type: integer
        data_tests: [not_null]
      - name: product_risk
        description: 1 when the party has no open accounts, policies, or portfolios.
        data_type: integer
        data_tests: [not_null]

version: 2

models:
  - name: customer_360
    description: >
      Public group customer 360. One row per party_key, built only from
      cross-project refs to banking, insurance, wealth, and financials.
      customer_id_hash uses the shared anonymize macro.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: customer_id
        description: Group party key (P-…).
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: customer_id_hash
        description: Anonymized party key via anonymize macro.
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: banking_customer_id
        description: Banking customer id when the party is in banking.
        data_type: varchar
      - name: banking_status
        description: Banking relationship status.
        data_type: varchar
      - name: account_count
        description: Open banking accounts.
        data_type: integer
        constraints: [{type: not_null}]
      - name: loan_count
        description: Outstanding loans.
        data_type: integer
        constraints: [{type: not_null}]
      - name: loan_balance
        description: Sum of outstanding loan principal.
        data_type: number(18,2)
        constraints: [{type: not_null}]
      - name: insurance_customer_id
        description: Insurance customer id when the party is in insurance.
        data_type: varchar
      - name: insurance_status
        description: Insurance relationship status.
        data_type: varchar
      - name: active_policy_count
        description: In-force insurance policies.
        data_type: integer
        constraints: [{type: not_null}]
      - name: annual_premium
        description: Sum of in-force annual premium.
        data_type: number(18,2)
        constraints: [{type: not_null}]
      - name: wealth_customer_id
        description: Wealth client id when the party is in wealth.
        data_type: varchar
      - name: wealth_status
        description: Wealth relationship status.
        data_type: varchar
      - name: portfolio_count
        description: Open wealth portfolios.
        data_type: integer
        constraints: [{type: not_null}]
      - name: assets_under_management
        description: Sum of open portfolio market value.
        data_type: number(18,2)
        constraints: [{type: not_null}]
      - name: total_revenue
        description: Sum of revenue from financials (all months).
        data_type: number(18,2)
        constraints: [{type: not_null}]
      - name: total_cost
        description: Sum of cost from financials (all months).
        data_type: number(18,2)
        constraints: [{type: not_null}]
      - name: total_profit
        description: Sum of profit from financials (all months).
        data_type: number(18,2)
        constraints: [{type: not_null}]
      - name: profit_months
        description: Months with both priced revenue and allocated cost.
        data_type: integer
        constraints: [{type: not_null}]
      - name: domain_count
        description: How many of banking / insurance / wealth the party appears in.
        data_type: integer
        constraints: [{type: not_null}]

exposures:
  - name: customer_360_dashboard
    label: Customer 360
    type: dashboard
    owner:
      name: Retail and wealth
      email: customer360@example.com
    depends_on:
      - ref('customer_360')
    description: Mesh-fed customer 360 feature table.

version: 2

seeds:
  - name: party_profile
    description: Demo party attributes for slicing Customer 360 in the semantic layer.
    columns:
      - name: party_key
        data_tests: [unique, not_null]
      - name: segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [retail, private, commercial]
      - name: region
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [nordics, emea, americas]
      - name: channel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [digital, branch, partner]
      - name: lifecycle
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [onboarding, established, at_risk, dormant]
      - name: value_tier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mass, affluent, hnw, uhwn]

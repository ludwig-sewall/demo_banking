version: 2

seeds:
  - name: customer_book
    description: >
      Demo customer book for Customer 360. Rows are designed with distinct
      commercial patterns so a later customer_segmentation_model can separate
      cohorts (distress, cross-sell, whale, dormant wealth, claims noise, etc.).
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: banking_revenue_eur
        data_tests: [not_null]
      - name: wealth_revenue_eur
        data_tests: [not_null]
      - name: insurance_revenue_eur
        data_tests: [not_null]
      - name: banking_missed_payments
        data_tests: [not_null]
      - name: banking_payment_remark
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Yes, No]
      - name: insurance_claims
        data_tests: [not_null]
      - name: insurance_successful_claims
        data_tests: [not_null]
      - name: customer_service_notes
        data_tests: [not_null]
      - name: current_interest
        data_tests: [not_null]

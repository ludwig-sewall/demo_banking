version: 2

sources:
  - name: wealth
    description: >
      Wealth client book in the warehouse backend (RAW_WEALTH).
      Client ids are not banking or insurance customer ids.
    schema: raw_wealth
    tables:
      - name: clients
        description: One row per wealth client.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 100000, period: hour}
      - name: portfolios
        description: One row per portfolio. Open market value rolls into assets under management.

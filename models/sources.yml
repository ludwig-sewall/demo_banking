version: 2

sources:
  - name: banking
    description: Core banking book (RAW_BANKING).
    schema: raw_banking
    tables:
      - name: customers
        description: One row per banking customer. party_key is shared with insurance and wealth.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 100000, period: hour}
      - name: accounts
        description: One row per deposit or card account.
      - name: loans
        description: One row per loan facility.

  - name: insurance
    description: Policy admin book (RAW_INSURANCE).
    schema: raw_insurance
    tables:
      - name: customers
        description: One row per insurance customer.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 100000, period: hour}
      - name: policies
        description: One row per policy.

  - name: wealth
    description: Wealth client book (RAW_WEALTH).
    schema: raw_wealth
    tables:
      - name: clients
        description: One row per wealth client.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 100000, period: hour}
      - name: portfolios
        description: One row per portfolio.

  - name: financials
    description: Management accounting at party grain (RAW_FINANCIALS).
    schema: raw_financials
    tables:
      - name: revenue_transactions
        description: One row per revenue posting.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 100000, period: hour}
      - name: allocated_costs
        description: One row per party per month.
